displayName: "AP: consumer returning 5xx"
combiner: OR
conditions:
  - displayName: "ap-consumer 5xx responses"
    conditionThreshold:
      filter: 'resource.type = "cloud_run_revision" AND resource.labels.service_name = "ap-consumer" AND metric.type = "run.googleapis.com/request_count" AND metric.labels.response_code_class = "5xx"'
      comparison: COMPARISON_GT
      thresholdValue: 0
      duration: 0s
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_SUM
          crossSeriesReducer: REDUCE_SUM
alertStrategy:
  autoClose: 1800s
notificationChannels:
  - projects/geap-ai-usecases-494501/notificationChannels/2914020540916398591
documentation:
  mimeType: text/markdown
  content: "ap-consumer returned 5xx. Check: gcloud logging read resource.labels.service_name=ap-consumer --freshness=30m. Common causes: database stopped, missing grant, bad env var, poison message."
